# Builds the course finder catalogue (universities and courses) from official open data
# and commits it to data/catalogue/. Runs monthly, when data/catalogue/REFRESH is committed,
# or from the Actions tab ("Run workflow"). See scripts/catalogue/build.mjs for the sources.
name: Build course catalogue

on:
  schedule:
    - cron: "17 3 3 * *" # 03:17 UTC on the 3rd of each month
  push:
    branches: [main]
    paths: ["data/catalogue/REFRESH"]
  workflow_dispatch:
    inputs:
      only:
        description: "Only these sources (comma separated: uk,australia,usa,canada,new-zealand,europe). Empty = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build catalogue from open data
        env:
          # optional free key from https://api.data.gov/signup (GitHub → Settings → Secrets → Actions)
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
          ONLY_INPUT: ${{ github.event.inputs.only }}
        run: |
          # "only: usa,uk" on the first line of data/catalogue/REFRESH rebuilds just those sources
          ONLY="$ONLY_INPUT"
          if [ -z "$ONLY" ] && [ -f data/catalogue/REFRESH ]; then ONLY="$(sed -n 's/^only: *//p' data/catalogue/REFRESH | head -n 1)"; fi
          node scripts/catalogue/build.mjs "$ONLY"

      - name: Commit the new catalogue
        run: |
          rm -f data/catalogue/REFRESH
          git config user.name "Edusphere catalogue bot"
          git config user.email "edusphereoverseastech@gmail.com"
          git add -A data/catalogue
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update course catalogue from open data"
            # main may have moved while the catalogue was building
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 10
            done
            exit 1
          fi
